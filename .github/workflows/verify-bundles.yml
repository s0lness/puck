name: verify-bundles

# Zero-secret: nothing in this file reads a secret, so it is safe to run on
# a pull_request from a fork. It reproduces the same proof a publisher
# already ran locally (docs/convention/publishing.md), unattended. It runs
# once per input change (push, pull request, a bumped pin), never on a
# schedule: a proof of pinned inputs does not decay (docs/decisions/0009).
on:
  pull_request:
    paths: [registry.json, "apps/**", "packs/**", "harness/**", "tools/**"]
  push:
    branches: [master]
    paths: [registry.json, "apps/**", "packs/**", "harness/**", "tools/**"]

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: cache zig
        id: cache-zig
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/zig
          key: zig-${{ env.ZIG_VERSION }}-linux-x86_64

      - name: install zig
        if: steps.cache-zig.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          mkdir -p ~/.local/zig
          tar -xJf /tmp/zig.tar.xz -C ~/.local/zig --strip-components=1
      - run: echo "$HOME/.local/zig" >> "$GITHUB_PATH"

      - run: bun install --frozen-lockfile

      # This job runs on Linux; this repository is developed on Windows.
      # tools/verify-bundle.ts must stay cross-platform (node:path, never a
      # hand-built "\\" path) for this step to work at all: its ZIG_EXE
      # default only falls back to a Windows path when nothing overrides it
      # AND the platform looks like Windows, so plain "zig" on PATH (just
      # added above) is what actually runs here.
      - name: verify every registry.json entry
        run: bun run tools/ci-verify-registry.ts
